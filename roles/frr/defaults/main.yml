---
frr_package_name: frr
frr_service_name: frr

frr_version: "8.1"

# Lock the currently installed frr package version. When enabled, the
# package is put on hold (apt-mark hold on the Debian family, dnf
# versionlock on the RedHat family) so that a later apt-get upgrade or
# dnf upgrade does not upgrade frr. The role itself still applies
# version changes, the lock is released before the package is installed
# and set again afterwards. Set this to false to release the lock.
frr_version_lock: true

frr_sysctl_defaults:
  - name: net.ipv4.ip_forward
    value: 1
  - name: net.ipv4.conf.all.send_redirects
    value: 0
  - name: net.ipv4.conf.all.accept_redirects
    value: 0
  - name: net.ipv4.fib_multipath_hash_policy
    value: 1
  - name: net.ipv4.conf.default.ignore_routes_with_linkdown
    value: 1
  - name: net.ipv4.conf.all.rp_filter
    value: 2
frr_sysctl_extra: []
frr_sysctl: "{{ frr_sysctl_defaults + frr_sysctl_extra }}"

frr_uplinks: []
frr_uplinks_groups:
  - generic

frr_dummy_interface: dummy0
frr_hostname: "{{ hostname_name | default(inventory_hostname_short) }}"
frr_local_as: 4200000000
# TODO(frickler): remove old var after deprecation
frr_loopback_interface: "{{ frr_dummy_interface | default('loopback0') }}"
frr_type: leaf
frr_loopback_v4: 127.0.0.42
frr_loopback_v6: 2001:db8:cafe:f00d::42

frr_externalbackup_v4: []
frr_externalbackup_v6: []
frr_internalbackup_v4: []
frr_internalbackup_v6: []

frr_extra_interfaces: []

# Numbered BGP neighbors, in addition to the interface based unnumbered
# uplinks in frr_uplinks. Use this for a peer that is not on a directly
# connected link, such as a route injector that speaks BGP to this router.
#
# Only address and remote_as are required. activate_ipv4 defaults to true
# because "frr defaults traditional" implies "bgp default ipv4-unicast";
# set it to false to render "no neighbor <address> activate" in the IPv4
# address family. activate_ipv6 defaults to false, matching FRR itself.
# route_map_out defaults to bgp_out, the same policy the uplinks use.
#
# Example:
# frr_bgp_neighbors:
#   - address: 2001:db8::1
#     remote_as: 65001
#     description: route injector
#     passive: true         # optional, for a peer that only dials outward
#     ebgp_multihop: 8      # optional, for a peer that is not adjacent
#     update_source: loopback0  # optional
#     password: secret      # optional
#     activate_ipv4: false  # optional, default true
#     activate_ipv6: true   # optional, default false
#     route_map_in: RM_IN   # optional
#     route_map_out: bgp_out    # optional, default bgp_out
frr_bgp_neighbors: []

# Prefixes that bgp_out permits outbound in addition to the connected routes
# the interface clauses match. Needed to re-advertise a route this router did
# not originate: route_match_interface() compares against the ifindex zebra
# sets on a redistributed connected route, which is unset on a route learned
# from a peer, so an interface clause can never match one.
#
# Entries are split by family on the address itself. ge and le are optional
# and map to the prefix list keywords of the same name.
#
# Example:
# frr_bgp_out_prefixes:
#   - prefix: 2001:db8:1::/48
#     le: 64
frr_bgp_out_prefixes: []
frr_bgp_out_prefix_list4: PL_BGP_OUT4
frr_bgp_out_prefix_list6: PL_BGP_OUT6

# VRRP configuration
# Example:
# frr_vrrp_groups:
#   - interface: eth0
#     id: 10
#     priority: 100  # optional, default 100
#     preempt: true  # optional, default true
#     ipv4:
#       - 192.168.1.1
#       - 192.168.1.2
#     ipv6:  # optional
#       - 2001:db8::1
frr_vrrp_groups: []

frr_incoming_table_external: 254

# Maximum number of ECMP paths installed per BGP address family
# (maximum-paths). With 0 no maximum-paths statement is written, so the
# FRR built-in default applies (256 in the Debian and RedHat family
# packages), which means all available paths are used. Set a value
# greater than 0 only to limit the number of paths. Not used by the
# yrzn templates.
frr_maximum_paths: 0

frr_local_pref:
  - 1000

frr_enable_bgpd: "yes"
frr_enable_bfdd: "no"
frr_enable_ospfd: "no"
frr_enable_ospf6d: "no"
frr_enable_vrrpd: "no"

frr_options_bgpd: "-A 127.0.0.1"
frr_options_bfdd: "-A 127.0.0.1"
frr_options_ospfd: "-A 127.0.0.1"
frr_options_ospf6d: "-A ::1"
frr_options_vrrpd: "-A 127.0.0.1"

# Set frr_config_template to provide the complete FRR configuration
# as a Jinja2 template from a variable (e.g. injected via Netbox config context).
# When defined, this takes precedence over all other configuration sources.
# frr_config_template:

# BFD (Bidirectional Forwarding Detection) profiles
# Optional BFD configuration for fast failure detection
# Example configuration:
# frr_bfd_profiles:
#   - name: fast
#     receive_interval: 300
#     transmit_interval: 300
#     detect_multiplier: 3
#   - name: slow
#     receive_interval: 1000
#     transmit_interval: 1000
#     detect_multiplier: 5
frr_bfd_profiles: []

frr_config_file: "/etc/frr/frr.conf"
frr_vtysh_file: "/etc/frr/vtysh.conf"
frr_daemons_file: "/etc/frr/daemons"

frr_allow_service_restart: true

# YRZN 001 configuration
frr_yrzn001_maximum_paths: 2

# YRZN Metalbox configuration
frr_yrzn_metalbox_bmc_loopback: loopback0
frr_yrzn_metalbox_bmc_peer_group: bmc-switches
frr_yrzn_metalbox_data_loopback: loopback1
frr_yrzn_metalbox_data_peer_group: data-switches
frr_yrzn_metalbox_timers_connect: 30
frr_yrzn_metalbox_timers_keepalive: 3
frr_yrzn_metalbox_timers_holdtime: 9
frr_yrzn_metalbox_maximum_paths: 2

# YRZN Network configuration
frr_yrzn_network_data_loopback: loopback0
frr_yrzn_network_data_peer_group: data-switches
frr_yrzn_network_provider_loopback: loopback1
frr_yrzn_network_provider_peer_group: provider-switches
frr_yrzn_network_timers_connect: 30
frr_yrzn_network_timers_keepalive: 3
frr_yrzn_network_timers_holdtime: 9
frr_yrzn_network_maximum_paths: 2
frr_yrzn_network_announced_networks: []

# prometheus-frr-exporter
# Optional Prometheus exporter for the local FRR instance. Disabled by
# default and only deployed on Debian-family systems when explicitly
# enabled. Setting frr_exporter_enable back to false stops, disables and
# removes the exporter again. Binds to localhost by default;
# frr_exporter_host accepts an IPv4, IPv6 or hostname value.
frr_exporter_enable: false
frr_exporter_package_name: prometheus-frr-exporter
frr_exporter_service_name: prometheus-frr-exporter
frr_exporter_host: 127.0.0.1
frr_exporter_port: 9342
