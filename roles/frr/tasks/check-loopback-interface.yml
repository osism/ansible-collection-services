---
# FRR announces the host's own addresses by matching the interface that
# carries them. If that interface does not exist, nothing is announced and
# the host drops off the fabric without an error, so check before frr.conf
# changes. Only templates that use frr_loopback_interface are checked.
# Template files arrive verbatim, but frr_config_template arrives already
# rendered, so also look for the rendered "match interface <name>".
#
# frr_check_loopback_interface: true fails the play, warn reports the
# finding as an ignored error and goes on. In warn mode an error in the
# check itself must not stop the play either, so the steps that gather
# the facts run in a block whose rescue records the error, and the report
# at the end handles both.
- name: Reset the loopback interface check
  ansible.builtin.set_fact:
    _frr_loopback_interface_declared: false
    _frr_loopback_check_error: ""

- name: Gather the facts for the loopback interface check
  block:
    - name: Determine whether the frr.conf template uses frr_loopback_interface
      ansible.builtin.set_fact:
        _frr_uses_loopback_interface: >-
          {{ _frr_template_text is search('frr_loopback_interface([^_a-zA-Z0-9]|$)')
             or _frr_template_text is search('match interface '
                  ~ (frr_loopback_interface | regex_escape) ~ '([^-_.a-zA-Z0-9]|$)') }}

    - name: Check that the loopback interface exists
      ansible.builtin.stat:
        path: "/sys/class/net/{{ frr_loopback_interface }}"
      register: _frr_loopback_interface_stat
      when: _frr_uses_loopback_interface | bool

    # osism apply network only writes the netplan files by default
    # (network_allow_service_restart: false); they take effect at the next
    # reboot. Until then an interface the netplan configuration declares is
    # not in /sys/class/net yet, and a frr.conf that matches it is still
    # right: FRR picks the interface up when it appears. netplan get reads
    # the configuration files, not the live state. Without netplan, or when
    # it cannot parse the files, the interface counts as not declared.
    # netplan get only reads, so it also runs in check mode; skipped, it
    # would leave the interface undeclared and fail a valid dry run.
    - name: Read the netplan configuration
      become: true
      ansible.builtin.command: netplan get
      register: _frr_netplan_get
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - _frr_uses_loopback_interface | bool
        - not _frr_loopback_interface_stat.stat.exists

    - name: Determine whether netplan declares the loopback interface
      ansible.builtin.set_fact:
        _frr_loopback_interface_declared: >-
          {{ frr_loopback_interface in
             ((((_frr_netplan_get.stdout | from_yaml) or {}).network | default({})) or {})
             | dict2items | selectattr('value', 'mapping')
             | map(attribute='value') | map('list') | flatten }}
      when:
        - _frr_uses_loopback_interface | bool
        - not _frr_loopback_interface_stat.stat.exists
        - (_frr_netplan_get.rc | default(1)) == 0
  rescue:
    - name: Record that the loopback interface check could not run
      ansible.builtin.set_fact:
        _frr_loopback_check_error: "{{ ansible_failed_result.msg | default('unknown error') }}"

- name: Report a loopback interface FRR would not find
  ansible.builtin.fail:
    msg: "{{ _frr_loopback_check_finding ~ _frr_loopback_check_note }}"
  vars:
    _frr_loopback_check_finding: >-
      {{ ('The check of frr_loopback_interface ' ~ frr_loopback_interface
          ~ ' could not run: ' ~ _frr_loopback_check_error)
         if _frr_loopback_check_error | length > 0
         else ('frr_loopback_interface is ' ~ frr_loopback_interface
               ~ ', but this host has no interface ' ~ frr_loopback_interface
               ~ ' and its netplan configuration declares none, so FRR would'
               ~ " announce none of the host's addresses. Rename the interface"
               ~ ' that carries them to ' ~ frr_loopback_interface
               ~ ', or set frr_loopback_interface to its name.') }}
    _frr_loopback_check_note: >-
      {{ ' frr_check_loopback_interface is warn, so the play goes on.'
         if _frr_check_loopback_mode == 'warn' else '' }}
  register: _frr_loopback_check_result
  ignore_errors: "{{ _frr_check_loopback_mode == 'warn' }}"
  when: >-
    _frr_loopback_check_error | length > 0
    or ((_frr_uses_loopback_interface | default(false) | bool)
        and not (_frr_loopback_interface_stat.stat.exists | default(false))
        and not (_frr_loopback_interface_declared | bool))
