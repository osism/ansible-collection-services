---
- name: Leave FRR on this host unchanged
  ansible.builtin.debug:
    msg: >-
      frr_managed_externally is true for {{ inventory_hostname }}:
      the frr role changes nothing on this host.
  when: frr_managed_externally | bool
  tags:
    - always

# A static import, so that each task keeps its own tags and --tags or
# --skip-tags select exactly what they did before the body moved here.
- name: Import frr management tasks
  ansible.builtin.import_tasks: manage.yml
  when: not (frr_managed_externally | bool)
